name = "gcw-synapse-super"
main = "cloudflare/worker.ts"
compatibility_date = "2026-05-31"
workers_dev = true

# Cloudflare Workers Builds / CI: produce admin assets before deploy
[build]
command = "npm run cf:build"

[assets]
directory = "apps/admin/dist"
binding = "ASSETS"
run_worker_first = true

[vars]
PUBLIC_EVENT_ALLOWED_ORIGINS = "https://www.gerberchildrenswear.com,https://gerberchildrenswear.com,https://gcw-dev.myshopify.com,https://gerberchildrenswear.myshopify.com"
PUBLIC_EVENT_MAX_BODY_BYTES = "16384"
PUBLIC_EVENT_RATE_LIMIT_PER_MINUTE = "120"
# TEMP restore: #14 deploy wiped admin when secret was unset. Keep until
# `wrangler secret put ADMIN_UI_PASSWORD`, then remove this plaintext var.
ADMIN_UI_PASSWORD = "Sugi2.0"
# Optional: wrangler secret put SESSION_HMAC_SECRET
# Global kill switch only. Set to "shadow_compare" to stop ALL forwarding.
# It can no longer promote a shop to forward — that is SHOP_RUNTIME_MODES' job.
RUNTIME_MODE = "forward"
# Per-shop runtime isolation (default-deny). A shop that is missing, unknown or
# absent from this map resolves to shadow and gets no sGTM destination, so one
# shared Worker cannot leak gcw-dev traffic into production tags.
SHOP_RUNTIME_MODES = "gerberchildrenswear.myshopify.com=forward,gcw-dev.myshopify.com=shadow"
# The only order topic allowed to forward a `purchase` event. Shopify delivers a
# paid order on both orders/create and orders/paid; forwarding both double-counts
# in Meta CAPI and TikTok, which dedupe on event_id. Switch to "orders/create"
# only if this shop starts taking unpaid/pending/COD orders that must convert.
PURCHASE_CANONICAL_TOPIC = "orders/paid"
# Per-shop sGTM collect URLs (REQUIRED for forwarding). The legacy global
# GTM_SERVER_URL secret is intentionally NOT used as a fallback — a forward
# shop with no BY_SHOP entry returns accepted_no_gtm_url. gcw-dev is also on a
# hard denylist and can never forward even if mis-mapped here.
# wrangler secret put GTM_SERVER_URL_BY_SHOP
#   value: gerberchildrenswear.myshopify.com=https://<sgtm-host>/g/collect
SHOP_DEFAULT_CURRENCY = "USD"
# Stolen from Elevar GTM-TKW58K8 constants (public pixel / measurement IDs — not API secrets)
FACEBOOK_PIXEL_ID = "823006016363458"
GA4_MEASUREMENT_ID = "G-YMJ9F7HY6P"
PINTEREST_ID = "2612527712746"
TIKTOK_PIXEL_ID = "COUGEIBC77UF83EUUA6G"
REDDIT_PIXEL_ID = "a2_iql6tlstlbj4"
GOOGLE_ADS_CONVERSION_ID = "874796722"
BLOOMREACH_ACCOUNT_ID = "7858"

[[kv_namespaces]]
binding = "SYNAPSE_STATE"
id = "ab156619a930418c834e53588103970b"

# Configure as secrets when ready:
# wrangler secret put SYNAPSE_INGRESS_TOKEN
# wrangler secret put ADMIN_UI_PASSWORD
# wrangler secret put SESSION_HMAC_SECRET
# wrangler secret put SHOPIFY_WEBHOOK_SECRET
# wrangler secret put GTM_SERVER_URL
# wrangler secret put GTM_FORWARD_SHARED_SECRET
# wrangler secret put SLACK_WEBHOOK_URL
# wrangler secret put ALERT_EMAIL_WEBHOOK_URL
