name = "gcw-synapse-super"
main = "cloudflare/worker.ts"
compatibility_date = "2026-05-31"
workers_dev = true

[assets]
directory = "apps/admin/dist"
binding = "ASSETS"
run_worker_first = true

[vars]
# Set this to your production Synapse API origin (Render, App Service, etc.)
SYNAPSE_ORIGIN_URL = "https://your-synapse-origin.example.com"

# Configure as a secret if your origin expects ingress auth:
# wrangler secret put SYNAPSE_INGRESS_TOKEN
