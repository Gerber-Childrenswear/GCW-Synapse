name: Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcw-synapse-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy gcw-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: gcw-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json

      - name: Verify required secrets are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNAPSE_INGRESS_TOKEN: ${{ secrets.SYNAPSE_INGRESS_TOKEN }}
          SYNAPSE_WRITE_SHARED_SECRET: ${{ secrets.SYNAPSE_WRITE_SHARED_SECRET }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN \
            SYNAPSE_INGRESS_TOKEN \
            SYNAPSE_WRITE_SHARED_SECRET \
            SHOPIFY_WEBHOOK_SECRET
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm --prefix apps/admin ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build admin
        run: npm run admin:build

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply synapse-db --remote --config wrangler.toml

      - name: Set Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNAPSE_INGRESS_TOKEN: ${{ secrets.SYNAPSE_INGRESS_TOKEN }}
          SYNAPSE_WRITE_SHARED_SECRET: ${{ secrets.SYNAPSE_WRITE_SHARED_SECRET }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$SYNAPSE_INGRESS_TOKEN" \
            | npx wrangler secret put SYNAPSE_INGRESS_TOKEN --config wrangler.toml
          printf '%s' "$SYNAPSE_WRITE_SHARED_SECRET" \
            | npx wrangler secret put SYNAPSE_WRITE_SHARED_SECRET --config wrangler.toml
          printf '%s' "$SHOPIFY_WEBHOOK_SECRET" \
            | npx wrangler secret put SHOPIFY_WEBHOOK_SECRET --config wrangler.toml

      - name: Deploy gcw-synapse-super
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy
