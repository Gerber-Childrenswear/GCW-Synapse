name: Release Tag Guard

on:
  push:
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      HOLD_STREAK_THRESHOLD: "3"
      SUCCESS_FRESHNESS_HOURS: "24"

    steps:
      - name: Check takeover readiness streak
        uses: actions/github-script@v7
        with:
          script: |
            const threshold = Number(process.env.HOLD_STREAK_THRESHOLD || "3");
            const freshnessHours = Number(process.env.SUCCESS_FRESHNESS_HOURS || "24");
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "takeover-readiness.yml",
              branch: "main",
              per_page: 100
            });

            let streak = 0;
            let sawSuccess = false;
            let latestSuccess = null;
            for (const run of runs) {
              if (run.status !== "completed") {
                continue;
              }

              if (run.conclusion === "failure") {
                streak += 1;
              } else if (run.conclusion === "success") {
                sawSuccess = true;
                latestSuccess = run;
                break;
              }

              if (streak >= threshold) {
                break;
              }
            }

            if (!sawSuccess && streak === 0) {
              core.setFailed("No successful takeover-readiness runs found yet. Release tags are blocked until readiness proves green.");
              return;
            }

            if (streak >= threshold) {
              core.setFailed(`Release blocked: consecutive takeover-readiness failures (${streak}) reached threshold (${threshold}).`);
              return;
            }

            if (!latestSuccess?.updated_at) {
              core.setFailed("Release blocked: latest successful takeover-readiness run is missing completion metadata.");
              return;
            }

            const successCompletedAt = new Date(latestSuccess.updated_at);
            const ageMs = Date.now() - successCompletedAt.getTime();
            const ageHours = ageMs / (1000 * 60 * 60);

            if (!Number.isFinite(ageHours)) {
              core.setFailed("Release blocked: could not compute readiness success age.");
              return;
            }

            if (ageHours > freshnessHours) {
              core.setFailed(
                `Release blocked: latest successful takeover-readiness run is stale (${ageHours.toFixed(1)}h old, threshold ${freshnessHours}h).`
              );
              return;
            }

            const releaseSha = context.sha;
            const readinessSha = latestSuccess.head_sha || null;

            if (!readinessSha) {
              core.setFailed("Release blocked: latest successful takeover-readiness run is missing head SHA metadata.");
              return;
            }

            if (releaseSha && readinessSha !== releaseSha) {
              core.setFailed(
                `Release blocked: latest successful takeover-readiness run validated ${readinessSha}, but current release ref points at ${releaseSha}.`
              );
              return;
            }

            core.info(
              `Release guard passed. Consecutive takeover-readiness failures: ${streak} (threshold ${threshold}). Latest success age: ${ageHours.toFixed(1)}h (threshold ${freshnessHours}h). Validated SHA: ${readinessSha}.`
            );
