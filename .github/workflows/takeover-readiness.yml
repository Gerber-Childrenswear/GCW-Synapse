name: Takeover Readiness

permissions:
  contents: read
  actions: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Synapse base URL
        required: false
        default: ""
      min_coverage_pct:
        description: Gate threshold override
        required: false
        default: ""
      min_paired_events:
        description: Gate threshold override
        required: false
        default: ""
      max_mismatch_rate_pct:
        description: Gate threshold override
        required: false
        default: ""
      min_confidence_pct:
        description: Confidence threshold override
        required: false
        default: ""
  schedule:
    - cron: "0 */6 * * *"

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      HOLD_STREAK_THRESHOLD: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate strict cutover report
        id: cutover
        continue-on-error: true
        env:
          SYNAPSE_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.SYNAPSE_BASE_URL }}
          SYNAPSE_INGRESS_TOKEN: ${{ secrets.SYNAPSE_INGRESS_TOKEN }}
        run: |
          npm run gtm:report:cutover:strict -- \
            --min_coverage_pct "${{ inputs.min_coverage_pct }}" \
            --min_paired_events "${{ inputs.min_paired_events }}" \
            --max_mismatch_rate_pct "${{ inputs.max_mismatch_rate_pct }}"

      - name: Run strict takeover verification
        id: verify
        continue-on-error: true
        env:
          SYNAPSE_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.SYNAPSE_BASE_URL }}
          SYNAPSE_INGRESS_TOKEN: ${{ secrets.SYNAPSE_INGRESS_TOKEN }}
        run: npm run gtm:verify:takeover:strict

      - name: Compute strict takeover confidence
        id: confidence
        continue-on-error: true
        run: |
          npm run gtm:confidence:takeover:strict -- \
            --min_confidence_pct "${{ inputs.min_confidence_pct }}"

      - name: Generate takeover decision runbook
        id: runbook
        if: always()
        continue-on-error: true
        run: npm run gtm:runbook:takeover

      - name: Generate takeover artifact manifest
        id: manifest
        if: always()
        continue-on-error: true
        run: npm run gtm:manifest:takeover

      - name: Verify takeover artifact manifest
        id: manifest_verify
        if: always()
        continue-on-error: true
        run: npm run gtm:manifest:verify:takeover:strict

      - name: Generate takeover release signal
        id: release_signal
        if: always()
        continue-on-error: true
        run: npm run gtm:release-signal:takeover:strict

      - name: Verify takeover artifact consistency
        id: consistency
        if: always()
        continue-on-error: true
        run: npm run gtm:consistency:takeover:strict

      - name: Evaluate strict results
        id: strict
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.cutover.outcome }}" == "success" && "${{ steps.verify.outcome }}" == "success" && "${{ steps.confidence.outcome }}" == "success" && "${{ steps.runbook.outcome }}" == "success" && "${{ steps.manifest.outcome }}" == "success" && "${{ steps.manifest_verify.outcome }}" == "success" && "${{ steps.release_signal.outcome }}" == "success" && "${{ steps.consistency.outcome }}" == "success" ]]; then
            echo "strict_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "strict_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload cutover artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takeover-readiness-artifacts
          path: docs/reports/cutover/
          if-no-files-found: warn
          retention-days: 14

      - name: Notify takeover status
        if: always() && secrets.TAKEOVER_NOTIFY_WEBHOOK_URL != ''
        env:
          TAKEOVER_NOTIFY_WEBHOOK_URL: ${{ secrets.TAKEOVER_NOTIFY_WEBHOOK_URL }}
        run: npm run gtm:notify:takeover

      - name: Open or update takeover regression issue
        if: always() && steps.strict.outputs.strict_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const title = "Takeover readiness regression";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const manifestSummaryPath = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), "docs", "reports", "cutover", "takeover-artifact-manifest-verify-latest.json");
            let manifestDetails = "";

            try {
              const summary = JSON.parse(fs.readFileSync(manifestSummaryPath, "utf8"));
              const failingArtifacts = summary.results
                .filter((result) => result.status === "mismatch")
                .map((result) => `- ${result.name} (${result.path})`);

              manifestDetails = [
                "",
                "Manifest verification:",
                `- Status: ${summary.status.toUpperCase()}`,
                `- Checked: ${summary.artifact_count}`,
                `- Mismatches: ${summary.mismatch_count}`,
                ...(failingArtifacts.length > 0 ? ["- Failing artifacts:", ...failingArtifacts] : ["- Failing artifacts: none"])
              ].join("\n");
            } catch (error) {
              manifestDetails = [
                "",
                "Manifest verification:",
                "- Status: unavailable",
                `- Summary path: ${manifestSummaryPath}`
              ].join("\n");
            }

            const consistencySummaryPath = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), "docs", "reports", "cutover", "takeover-artifact-consistency-latest.json");
            let consistencyDetails = "";

            try {
              const summary = JSON.parse(fs.readFileSync(consistencySummaryPath, "utf8"));
              const failingChecks = summary.checks
                .filter((check) => check.status === "fail")
                .map((check) => `- ${check.name}: ${check.details}`);

              consistencyDetails = [
                "",
                "Artifact consistency verification:",
                `- Status: ${summary.status.toUpperCase()}`,
                `- Checks: ${summary.checksPassed} pass / ${summary.checksFailed} fail`,
                ...(failingChecks.length > 0 ? ["- Failing checks:", ...failingChecks] : ["- Failing checks: none"])
              ].join("\n");
            } catch (error) {
              consistencyDetails = [
                "",
                "Artifact consistency verification:",
                "- Status: unavailable",
                `- Summary path: ${consistencySummaryPath}`
              ].join("\n");
            }

            const body = [
              "Strict takeover readiness checks failed.",
              "",
              `- Run: ${runUrl}`,
              "- Workflow: takeover-readiness",
              `- Branch: ${context.ref}`,
              "",
              "Review workflow artifacts in docs/reports/cutover and resolve failing gate/contract checks.",
              manifestDetails,
              consistencyDetails
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["takeover", "regression"]
              });
            }

      - name: Compute consecutive strict failure streak
        id: streak
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const threshold = Number(process.env.HOLD_STREAK_THRESHOLD || "3");
            const strictFailed = "${{ steps.strict.outputs.strict_failed }}" === "true";

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "takeover-readiness.yml",
              branch: "main",
              per_page: 100
            });

            let streak = strictFailed ? 1 : 0;
            for (const run of runs) {
              if (run.id === context.runId) {
                continue;
              }

              if (run.conclusion === "failure") {
                streak += 1;
              } else if (run.conclusion === "success") {
                break;
              }

              if (streak >= threshold) {
                break;
              }
            }

            core.setOutput("streak", String(streak));
            core.setOutput("threshold", String(threshold));

      - name: Enforce strict readiness result
        if: always() && steps.strict.outputs.strict_failed == 'true'
        shell: bash
        run: |
          echo "Strict readiness checks failed (cutover=${{ steps.cutover.outcome }}, verify=${{ steps.verify.outcome }}, confidence=${{ steps.confidence.outcome }}, runbook=${{ steps.runbook.outcome }}, manifest=${{ steps.manifest.outcome }}, manifest_verify=${{ steps.manifest_verify.outcome }}, release_signal=${{ steps.release_signal.outcome }}, consistency=${{ steps.consistency.outcome }})."
          echo "Current consecutive failure streak: ${{ steps.streak.outputs.streak }}"
          exit 1
