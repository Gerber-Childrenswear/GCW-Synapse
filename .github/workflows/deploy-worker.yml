name: Deploy Worker

# Primary prod deploys usually come from Cloudflare Workers Builds.
# This workflow is a fallback — requires a valid CLOUDFLARE_API_TOKEN secret
# (raw token only: no "Bearer " prefix, no trailing newline).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Validate Cloudflare API token format
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Workers Builds may still deploy; fix the GitHub secret for this workflow."
            exit 1
          fi
          if printf '%s' "${CLOUDFLARE_API_TOKEN}" | grep -qE '[[:space:]]|^Bearer '; then
            echo "::error::CLOUDFLARE_API_TOKEN looks malformed (whitespace or Bearer prefix). Paste the raw API token only."
            exit 1
          fi
          echo "Token format looks ok (length=${#CLOUDFLARE_API_TOKEN})."

      - name: Build (browser + admin)
        run: npm run cf:build

      - name: Deploy gcw-synapse-super
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.toml
