# Link this file to your existing Partners app (gcw-dev install).
# 1. Partners → Apps → GCW Synapse → Client credentials → copy Client ID below.
# 2. shopify app config link
# 3. shopify app deploy

name = "GCW Synapse"
client_id = "7d011b70562512bd84b85bd3f9a6e68d"
application_url = "https://gcw-synapse-super.gcwsynapse.workers.dev"
embedded = true

[access_scopes]
# Analytics / Elevar-replacement surface: pixels, checkout events, orders/refunds,
# catalog + customer context, and webhook subscription management.
scopes = "read_products,read_orders,read_all_orders,read_checkouts,read_customers,read_customer_events,write_pixels,read_themes,read_content,read_discounts,read_price_rules,read_shipping,read_markets,read_locales,read_inventory,read_locations,read_fulfillments"

[auth]
redirect_urls = [
  "https://gcw-synapse-super.gcwsynapse.workers.dev/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true


[webhooks]
api_version = "2025-10"
