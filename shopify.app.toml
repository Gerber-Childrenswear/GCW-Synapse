# Link this file to your existing Partners app (gcw-dev install).
# 1. Partners → Apps → GCW Synapse → Client credentials → copy Client ID below.
# 2. shopify app config link
# 3. shopify app deploy

name = "GCW Synapse"
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
application_url = "https://gcw-synapse-super.gcw-synapse.workers.dev"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_themes"

[auth]
redirect_urls = [
  "https://gcw-synapse-super.gcw-synapse.workers.dev/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
