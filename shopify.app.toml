# Link this file to the Shopify Dev Dashboard app for gcw-dev.
# Dev Dashboard client ID (custom app) — installable without store-owner "install apps" ping.

name = "GCW Synapse"
client_id = "ad45451a4c49376bdeae4dae0f3ac26a"
application_url = "https://gcw-synapse-super.gcwsynapse.workers.dev"
embedded = true

[access_scopes]
# Lean install scopes (no protected scopes).
# NOTE: do NOT include read_all_orders — that requires Shopify Partner
# "Request access" approval and causes the install loop.
scopes = "read_products,read_orders,read_checkouts,read_customers,read_customer_events,write_pixels,read_themes"

[auth]
redirect_urls = [
  "https://gcw-synapse-super.gcwsynapse.workers.dev/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true


[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://gcw-synapse-super.gcwsynapse.workers.dev/webhooks/shopify/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "https://gcw-synapse-super.gcwsynapse.workers.dev/webhooks/shopify/orders/paid"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "https://gcw-synapse-super.gcwsynapse.workers.dev/webhooks/shopify/refunds/create"
